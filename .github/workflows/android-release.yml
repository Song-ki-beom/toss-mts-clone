name: Android Release

# v0.3.0 처럼 v로 시작하는 태그를 푸시하면 서명된 APK·AAB를 만들어 GitHub Release에 올린다
on:
  push:
    tags: ['v*']
  workflow_dispatch:

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: 21
      - uses: gradle/actions/setup-gradle@v6

      - name: 서명 키 복원
        env:
          KEYSTORE_BASE64: ${{ secrets.MTS_KEYSTORE_BASE64 }}
        run: |
          if [ -z "$KEYSTORE_BASE64" ]; then
            echo "::error::MTS_KEYSTORE_BASE64 시크릿이 없습니다. README의 'Android 앱 배포'를 참고하세요."
            exit 1
          fi
          echo "$KEYSTORE_BASE64" | base64 --decode > "$RUNNER_TEMP/release-key.jks"
          echo "MTS_KEYSTORE_PATH=$RUNNER_TEMP/release-key.jks" >> "$GITHUB_ENV"

      - name: 버전 정하기
        run: |
          NAME="${GITHUB_REF_NAME#v}"
          if [ "$GITHUB_REF_TYPE" != "tag" ]; then NAME="0.0.0-dev"; fi
          echo "VERSION_NAME=$NAME" >> "$GITHUB_ENV"

      - name: 테스트 후 릴리스 빌드 (APK, AAB)
        env:
          MTS_KEYSTORE_PASSWORD: ${{ secrets.MTS_KEYSTORE_PASSWORD }}
          MTS_KEY_ALIAS: ${{ secrets.MTS_KEY_ALIAS }}
          MTS_KEY_PASSWORD: ${{ secrets.MTS_KEY_PASSWORD }}
          # 공개된 중계 서버 주소라 비밀값이 아니다. 비워 두면 앱은 기기 안의 모의 시세로 동작한다
          MTS_SERVER_URL: https://mts-relay.onrender.com
        run: >
          ./gradlew :core:test assembleRelease bundleRelease --no-daemon
          -PversionCode=${{ github.run_number }} -PversionName=${{ env.VERSION_NAME }}

      - name: 파일 이름 정리
        run: |
          mkdir -p dist
          cp app/build/outputs/apk/release/app-release.apk "dist/toss-mts-clone-${VERSION_NAME}.apk"
          cp app/build/outputs/bundle/release/app-release.aab "dist/toss-mts-clone-${VERSION_NAME}.aab"
          ls -la dist

      - name: GitHub Release 만들기
        if: github.ref_type == 'tag'
        env:
          GH_TOKEN: ${{ github.token }}
        run: >
          gh release create "$GITHUB_REF_NAME" dist/*
          --title "Toss MTS Clone $GITHUB_REF_NAME"
          --notes "학습용 모의투자 앱입니다. APK는 휴대폰에 직접 설치, AAB는 Google Play 업로드용입니다. 시세는 중계 서버(Render)를 거쳐 한국투자증권 모의투자 시세를 받습니다. 무료 서버라 첫 접속은 최대 1분 정도 걸릴 수 있습니다."
          --verify-tag

      - name: 수동 실행 시 결과물 보관
        if: github.ref_type != 'tag'
        uses: actions/upload-artifact@v7
        with:
          name: android-release
          path: dist/
